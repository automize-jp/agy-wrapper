name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows x86_64
          - os: ubuntu-latest
            goos: windows
            goarch: amd64
            platform: windows-amd64
            binary_name: agy.exe

          # Linux x86_64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
            binary_name: agy

          # Linux ARM64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            platform: linux-arm64
            binary_name: agy

          # macOS Intel (x86_64)
          - os: macos-latest
            goos: darwin
            goarch: amd64
            platform: darwin-amd64
            binary_name: agy

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
            binary_name: agy

          # macOS Universal (Intel + Apple Silicon)
          - os: macos-latest
            goos: darwin
            platform: darwin-universal
            binary_name: agy
            is_universal: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME:-v0.0.0}"
          if [[ "$RAW_VER" != v* ]]; then
            VER="v$RAW_VER"
          else
            VER="$RAW_VER"
          fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - name: Build Binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.is_universal }}" = "true" ]; then
            GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/agy-amd64 ./src
            GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/agy-arm64 ./src
            lipo -create -output dist/agy dist/agy-amd64 dist/agy-arm64
            rm dist/agy-amd64 dist/agy-arm64
          else
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o dist/${{ matrix.binary_name }} ./src
          fi
          if [ "${{ matrix.binary_name }}" = "agy" ]; then
            chmod +x dist/agy
          fi

      - name: Package Archive
        shell: bash
        run: |
          STAGE_DIR="stage"
          mkdir -p "$STAGE_DIR"
          cp "dist/${{ matrix.binary_name }}" "$STAGE_DIR/"
          cp LICENSE "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"
          cp -r i18n "$STAGE_DIR/"

          ZIP_NAME="agy-wrapper-${VERSION}-${{ matrix.platform }}.zip"
          cd "$STAGE_DIR"
          zip -r "../$ZIP_NAME" ./*
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: agy-wrapper-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd release_artifacts
          sha256sum agy-wrapper-*.zip > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release_artifacts/agy-wrapper-*.zip
            release_artifacts/checksums.txt
          generate_release_notes: true
